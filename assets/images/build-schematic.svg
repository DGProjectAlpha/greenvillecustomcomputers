<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" fill="none" role="img" aria-labelledby="schematicTitle schematicDesc">
  <title id="schematicTitle">Custom PC build schematic</title>
  <desc id="schematicDesc">An architectural diagram of a desktop computer case showing the motherboard, CPU, memory, graphics card, storage, and power supply.</desc>
  <defs>
    <linearGradient id="boardWash" x1="90" y1="40" x2="390" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e7eef5"/>
    </linearGradient>
    <linearGradient id="moduleFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#edf3f8" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Canvas / case outline -->
  <rect x="64" y="24" width="352" height="532" rx="22" fill="url(#boardWash)" stroke="#9aa8b8" stroke-width="1.25"/>
  <rect x="84" y="44" width="312" height="492" rx="14" fill="#fbfcfe" stroke="#c5d0dc" stroke-width="1"/>

  <!-- Fine architectural grid -->
  <g stroke="#b7c4d2" stroke-opacity="0.35" stroke-width="0.6">
    <path d="M84 120 H396"/>
    <path d="M84 200 H396"/>
    <path d="M84 280 H396"/>
    <path d="M84 360 H396"/>
    <path d="M84 440 H396"/>
    <path d="M160 44 V536"/>
    <path d="M240 44 V536"/>
    <path d="M320 44 V536"/>
  </g>

  <!-- Dimension ticks -->
  <g stroke="#7f8f9f" stroke-width="1" stroke-linecap="square">
    <path d="M64 44 H52"/>
    <path d="M64 536 H52"/>
    <path d="M58 44 V536"/>
    <path d="M84 24 V12"/>
    <path d="M396 24 V12"/>
    <path d="M84 18 H396"/>
  </g>

  <!-- Motherboard plate -->
  <rect x="112" y="72" width="256" height="292" rx="8" fill="url(#moduleFill)" stroke="#8fa0b2" stroke-width="1.2"/>
  <path d="M112 88 H368" stroke="#c2ced9" stroke-width="1"/>
  <circle cx="128" cy="80" r="2.5" fill="#0f766e"/>
  <circle cx="144" cy="80" r="2.5" fill="#c2ced9"/>
  <circle cx="160" cy="80" r="2.5" fill="#c2ced9"/>

  <!-- CPU -->
  <rect x="164" y="120" width="76" height="76" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <rect x="176" y="132" width="52" height="52" rx="3" fill="#eef4f8" stroke="#a9b7c6"/>
  <path d="M186 146 h32 M186 158 h32 M186 170 h20" stroke="#0f766e" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
  <text x="202" y="216" text-anchor="middle" fill="#5a6876" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="1.6">CPU</text>

  <!-- RAM -->
  <rect x="268" y="114" width="14" height="100" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="288" y="114" width="14" height="100" rx="2" fill="#ffffff" stroke="#a9b7c6" stroke-width="1.2"/>
  <rect x="268" y="122" width="14" height="3.5" fill="#0f766e"/>
  <rect x="288" y="122" width="14" height="3.5" fill="#a9b7c6"/>
  <text x="285" y="234" text-anchor="middle" fill="#5a6876" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="1.6">RAM</text>

  <!-- Traces -->
  <path d="M128 248 h44 v36 h-18" stroke="#0f766e" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
  <path d="M240 248 h84 v18" stroke="#0f766e" stroke-opacity="0.28" stroke-width="1.2" fill="none"/>
  <rect x="128" y="264" width="30" height="20" rx="3" fill="#ffffff" stroke="#a9b7c6"/>

  <!-- GPU -->
  <rect x="124" y="292" width="232" height="52" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.35"/>
  <rect x="136" y="304" width="34" height="28" rx="4" fill="#eef4f8" stroke="#0f766e" stroke-opacity="0.45"/>
  <rect x="180" y="308" width="150" height="7" rx="2" fill="#0f766e" opacity="0.22"/>
  <rect x="180" y="322" width="104" height="7" rx="2" fill="#0f766e" opacity="0.12"/>
  <text x="240" y="368" text-anchor="middle" fill="#5a6876" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="1.6">GPU</text>

  <!-- SSD -->
  <rect x="124" y="404" width="96" height="40" rx="6" fill="#ffffff" stroke="#8fa0b2"/>
  <rect x="136" y="418" width="52" height="6" rx="1.5" fill="#0f766e" opacity="0.35"/>
  <text x="172" y="466" text-anchor="middle" fill="#5a6876" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="1.6">SSD</text>

  <!-- PSU -->
  <rect x="240" y="400" width="116" height="92" rx="8" fill="#ffffff" stroke="#8fa0b2"/>
  <circle cx="274" cy="446" r="18" fill="#eef4f8" stroke="#a9b7c6"/>
  <circle cx="274" cy="446" r="7" fill="#0f766e" opacity="0.2"/>
  <circle cx="324" cy="446" r="18" fill="#eef4f8" stroke="#a9b7c6"/>
  <text x="298" y="516" text-anchor="middle" fill="#5a6876" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="1.6">PSU</text>

  <!-- Callout leaders -->
  <g stroke="#0f766e" stroke-opacity="0.4" stroke-width="1">
    <path d="M84 158 H48"/>
    <path d="M396 318 H432"/>
  </g>
  <circle cx="48" cy="158" r="2.5" fill="#0f766e"/>
  <circle cx="432" cy="318" r="2.5" fill="#0f766e"/>
</svg>
