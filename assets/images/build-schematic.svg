<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" fill="none" role="img" aria-labelledby="schematicTitle schematicDesc">
  <title id="schematicTitle">Custom PC build schematic</title>
  <desc id="schematicDesc">A technical diagram of a desktop computer case showing the motherboard, CPU, memory, graphics card, storage, and power supply.</desc>
  <defs>
    <linearGradient id="glass" x1="80" y1="40" x2="400" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a28" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#101018" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gpu" x1="120" y1="300" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e8c0"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer case -->
  <rect x="72" y="28" width="336" height="524" rx="18" fill="#12121a" stroke="#2a2a38" stroke-width="2"/>
  <rect x="88" y="48" width="304" height="484" rx="10" fill="url(#glass)" stroke="#00e8c0" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- LED strip -->
  <rect x="72" y="48" width="8" height="484" rx="2" fill="#00e8c0" opacity="0.85" filter="url(#glow)"/>

  <!-- Motherboard -->
  <rect x="118" y="78" width="244" height="300" rx="6" fill="#161622" stroke="#3a3a4a" stroke-width="1.25"/>
  <path d="M118 92 H362" stroke="#2e2e3c" stroke-width="1"/>
  <circle cx="132" cy="92" r="3" fill="#00e8c0" opacity="0.7"/>
  <circle cx="148" cy="92" r="3" fill="#3a3a4a"/>
  <circle cx="164" cy="92" r="3" fill="#3a3a4a"/>

  <!-- CPU -->
  <rect x="168" y="128" width="72" height="72" rx="4" fill="#1c1c28" stroke="#00e8c0" stroke-width="1.5"/>
  <rect x="180" y="140" width="48" height="48" rx="2" fill="#0e0e16" stroke="#4a4a5a"/>
  <path d="M188 152 h32 M188 164 h32 M188 176 h22" stroke="#00e8c0" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="204" y="218" text-anchor="middle" fill="#9a9aaa" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.4">CPU</text>

  <!-- RAM -->
  <rect x="268" y="120" width="14" height="96" rx="2" fill="#1a1a26" stroke="#00e8c0" stroke-width="1.2"/>
  <rect x="288" y="120" width="14" height="96" rx="2" fill="#1a1a26" stroke="#5a5a6a" stroke-width="1.2"/>
  <rect x="268" y="128" width="14" height="4" fill="#00e8c0"/>
  <rect x="288" y="128" width="14" height="4" fill="#4a4a5a"/>
  <text x="285" y="236" text-anchor="middle" fill="#9a9aaa" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.4">RAM</text>

  <!-- Chipset / traces -->
  <path d="M132 250 h40 v40 h-16" stroke="#2e8f7a" stroke-opacity="0.5" stroke-width="1.25" fill="none"/>
  <path d="M240 250 h80 v20" stroke="#2e8f7a" stroke-opacity="0.4" stroke-width="1.25" fill="none"/>
  <rect x="132" y="268" width="28" height="20" rx="2" fill="#1a1a26" stroke="#3a3a4a"/>

  <!-- GPU -->
  <rect x="128" y="292" width="224" height="52" rx="5" fill="#14141e" stroke="url(#gpu)" stroke-width="1.6"/>
  <rect x="140" y="304" width="36" height="28" rx="3" fill="#0a0a0f" stroke="#00e8c0" stroke-opacity="0.5"/>
  <rect x="184" y="308" width="148" height="8" rx="2" fill="#00e8c0" opacity="0.35"/>
  <rect x="184" y="322" width="100" height="8" rx="2" fill="#00e8c0" opacity="0.2"/>
  <text x="240" y="368" text-anchor="middle" fill="#9a9aaa" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.4">GPU</text>

  <!-- Storage -->
  <rect x="128" y="400" width="88" height="36" rx="4" fill="#161622" stroke="#3a3a4a"/>
  <rect x="138" y="412" width="48" height="6" rx="1" fill="#00e8c0" opacity="0.45"/>
  <text x="172" y="456" text-anchor="middle" fill="#9a9aaa" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.4">SSD</text>

  <!-- PSU -->
  <rect x="236" y="396" width="116" height="88" rx="6" fill="#14141c" stroke="#3a3a4a"/>
  <circle cx="268" cy="440" r="18" fill="#0a0a0f" stroke="#4a4a5a"/>
  <circle cx="268" cy="440" r="8" fill="#00e8c0" opacity="0.25"/>
  <circle cx="320" cy="440" r="18" fill="#0a0a0f" stroke="#4a4a5a"/>
  <text x="294" y="508" text-anchor="middle" fill="#9a9aaa" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.4">PSU</text>

  <!-- Callout lines -->
  <path d="M88 164 H48" stroke="#00e8c0" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M392 318 H432" stroke="#00e8c0" stroke-opacity="0.4" stroke-width="1"/>
</svg>
